<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>椰叶截面 · 同条件对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111a1b;color:#e5edeb;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:18px;font-weight:500;margin:0}p{margin:3px 0;color:#a3b7b1;font-size:12px}select,button{font:inherit;color:inherit;background:#223331;border:1px solid #465b54;border-radius:5px;padding:6px 10px}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.viewer{position:relative;width:min(calc((100vh - 160px)*1209/1292),96vw);aspect-ratio:1209/1292;margin:auto;overflow:hidden;background:#081214}.viewer img{position:absolute;inset:0;width:100%;height:100%;display:block}.front{clip-path:inset(0 50% 0 0)}.divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#fff9;pointer-events:none}.labels{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.labels span{background:#0d1a1ac9;padding:2px 8px;border-radius:3px}.range{width:min(650px,90vw);margin:12px auto 20px;display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:#85d3ba}.hint{color:#a9bcb5;white-space:nowrap;font-size:12px}a{color:#9bd5c2}
</style>
<header><div><h1>椰叶截面，同条件对照</h1><p>相同机位、时间、日光、尺寸、叶数与材料；A为原截面，B为局部截面。GI与局部灯在两侧均关闭。</p></div>
<div class="controls"><select id="view" aria-label="比较视角"></select><button id="a">仅 A</button><button id="ab">拖动比较</button><button id="b">仅 B</button><button id="zoom" aria-pressed="false">放大细看</button><a id="raw-a" target="_blank" rel="noopener">原图 A</a><a id="raw-b" target="_blank" rel="noopener">原图 B</a><a href="/">回到海岛</a></div></header>
<main><div class="viewer"><img id="back" alt="候选B相同机位截图"><img id="front" class="front" alt="原版A相同机位截图"><div id="divider" class="divider"></div><div class="labels"><span>原版 A</span><span>候选 B</span></div></div><div class="range"><span class="hint">B</span><input id="split" type="range" min="0" max="100" value="50" aria-label="原版A覆盖比例"><span class="hint">A</span></div></main>
<script>
const view=document.querySelector('#view'),front=document.querySelector('#front'),back=document.querySelector('#back'),split=document.querySelector('#split'),divider=document.querySelector('#divider');let zoom=1;
for(const [height,label] of [['2p5','低机位'],['14','中机位'],['45','俯视']])for(const az of ['000','090','180','270'])view.add(new Option(label+' · '+Number(az)+'°','eye-'+height+'-az-'+az));
view.add(new Option('高清树冠 · 2560像素','HD'));
function updateView(){const hd=view.value==='HD',viewer=document.querySelector('.viewer');front.src=hd?'HD-legacy.png':view.value+'-legacy.png';back.src=hd?'HD-transport.png':view.value+'-transport.png';viewer.style.aspectRatio=hd?'2560/1706':'1209/1292';viewer.style.width=hd?'min(calc((100vh - 160px)*2560/1706),96vw)':'';document.querySelector('#raw-a').href=front.src;document.querySelector('#raw-b').href=back.src;}
function updateSplit(value){split.value=value;front.style.clipPath='inset(0 '+(100-(50+(value-50)/zoom))+'% 0 0)';divider.style.left=value+'%';const left=document.querySelector('.labels span:first-child'),right=document.querySelector('.labels span:last-child');left.style.opacity=value===0?0:1;right.style.opacity=value===100?0:1;left.setAttribute('aria-hidden',String(value===0));right.setAttribute('aria-hidden',String(value===100));}
view.addEventListener('change',updateView);split.addEventListener('input',()=>updateSplit(Number(split.value)));
document.querySelector('#a').onclick=()=>updateSplit(100);document.querySelector('#ab').onclick=()=>updateSplit(50);document.querySelector('#b').onclick=()=>updateSplit(0);document.querySelector('#zoom').onclick=event=>{zoom=zoom===1?2:1;front.style.transform=back.style.transform='scale('+zoom+')';event.target.textContent=zoom===1?'放大细看':'整幅画面';event.target.setAttribute('aria-pressed',String(zoom===2));updateSplit(Number(split.value));};updateView();
</script></html>
