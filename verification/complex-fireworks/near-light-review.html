<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>近景火光 · 实景对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1013;color:#e9eeeb;font:15px/1.65 system-ui,sans-serif}header{padding:24px clamp(16px,4vw,56px);max-width:1100px}h1{font-size:26px;font-weight:500;margin:0 0 8px}p{color:#aebdb9;margin:8px 0}a{color:#b9ddd1}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{font:inherit;color:inherit;background:#1c2c2c;border:1px solid #4a605b;border-radius:5px;padding:7px 14px;cursor:pointer}button[aria-pressed=true]{background:#d2e5dc;color:#102720}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px 32px}.view{margin:0;min-width:0}.view figcaption{position:sticky;top:0;z-index:1;padding:8px 12px;background:#132124e8}.viewport{overflow:auto;max-height:85vh;border:1px solid #344448}.viewport img{display:block;width:100%;height:auto}.native .viewport img{width:1209px;max-width:none}.native .viewport{height:85vh}.note{font-size:13px} @media(max-width:720px){.views{grid-template-columns:1fr}.viewport{max-height:none}}
</style>
<header><h1>近景火光：方边与快门采样</h1><p>实际场景截图，原生画幅均为1209 × 1292。相同种子、镜头、燃烧阶段与用户HDR设置；重新载入前后，背景时间有轻微差异。近景诊断将镜头移到火光约6米处，故画面没有小岛。</p><p>左图可见光点底部的矩形光晕，右图换为圆润的高斯散射，并细分近景火光的快门积分。实际尺寸与总亮度未调大。</p><nav><button id="fit" aria-pressed="true">适合页面</button><button id="native" aria-pressed="false">100%高清 · 滚动查看</button><button id="core" aria-pressed="false">查看关闭辉光的本体</button><a href="../../">返回海岛</a></nav><p class="note">可打开原图单独放大：<a id="before-link" href="near-before-bloom.png">原版</a> · <a id="after-link" href="near-after-gaussian.png">修正后</a>。这些静帧用于看方边；完整动态请在海岛页面体验。</p></header>
<main class="views"><figure class="view"><figcaption>原版</figcaption><div class="viewport"><img id="before" src="near-before-bloom.png" alt="原版近景火光，底部光晕呈矩形"></div></figure><figure class="view"><figcaption>修正后</figcaption><div class="viewport"><img id="after" src="near-after-gaussian.png" alt="修正后的近景火光，光晕变圆"></div></figure></main>
<script>
const fit=document.getElementById('fit'),native=document.getElementById('native'),core=document.getElementById('core');for(const b of [fit,native])b.onclick=()=>{document.body.classList.toggle('native',b===native);fit.setAttribute('aria-pressed',String(b===fit));native.setAttribute('aria-pressed',String(b===native));};core.onclick=()=>{const on=core.getAttribute('aria-pressed')!=='true';core.setAttribute('aria-pressed',String(on));for(const [id,file]of [['before',on?'near-before-no-bloom.png':'near-before-bloom.png'],['after',on?'near-after-head-no-bloom.png':'near-after-gaussian.png']]){document.getElementById(id).src=file;document.getElementById(id+'-link').href=file;}};
</script></html>
